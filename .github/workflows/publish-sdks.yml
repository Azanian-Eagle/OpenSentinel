name: Publish SDKs

on:
  push:
    tags:
      - "v*"
      - "[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Sync NPM Package Versions with Git Tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$TAG_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "Syncing package versions to $TAG_VERSION"
            npm version "$TAG_VERSION" --no-git-tag-version --allow-same-version
            cd sdk/react/opensentinel-react
            npm version "$TAG_VERSION" --no-git-tag-version --allow-same-version
          fi

      - name: Install and Build React SDK
        run: |
          cd sdk/react/opensentinel-react
          npm ci
          npm run build

      - name: Publish React SDK
        # Note: NPM_TOKEN must be configured as an Automation Token on npmjs.com to bypass 2FA (EOTP) in automated CI environments.
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "NPM_TOKEN is not set. Skipping React SDK npm publish."
            exit 0
          fi
          cd sdk/react/opensentinel-react
          npm publish --access public || echo "::warning::React SDK npm publish failed (check if @opensentinel scope exists on npmjs.org and NPM_TOKEN is an Automation Token)."
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Install and Build Root NPM package
        run: |
          npm ci
          npm run build

      - name: Publish Root NPM package
        # Note: NPM_TOKEN must be configured as an Automation Token on npmjs.com to bypass 2FA (EOTP) in automated CI environments.
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "NPM_TOKEN is not set. Skipping Root package npm publish."
            exit 0
          fi
          npm publish --access public || echo "::warning::Root package npm publish failed (check if @opensentinel scope exists on npmjs.org and NPM_TOKEN is an Automation Token)."
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-pypi:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tools
        run: pip install build

      - name: Sync Python SDK Version with Git Tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$TAG_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "Syncing Python SDK version to $TAG_VERSION"
            sed -i "s/^version = .*/version = \"$TAG_VERSION\"/" sdk/python/pyproject.toml
            sed -i "s/version=\".*\"/version=\"$TAG_VERSION\"/" sdk/python/setup.py
          fi

      - name: Build Python SDK
        run: |
          cd sdk/python
          python -m build

      - name: Check PyPI Token
        id: check_token
        run: |
          if [ -n "$PYPI_TOKEN" ]; then
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          else
            echo "PYPI_TOKEN is not set. Skipping PyPI publish."
            echo "has_token=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}

      - name: Publish Python SDK
        if: steps.check_token.outputs.has_token == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdk/python/dist/
          password: ${{ secrets.PYPI_TOKEN }}
          skip-existing: true

  publish-cargo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Sync Cargo Crate Version with Git Tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$TAG_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "Syncing Cargo crate version to $TAG_VERSION"
            sed -i "s/^version = .*/version = \"$TAG_VERSION\"/" server/Cargo.toml
          fi

      - name: Publish to crates.io
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "CARGO_REGISTRY_TOKEN is not set. Skipping cargo publish."
            exit 0
          fi
          cd server
          cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  publish-helm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync Helm Chart Version with Git Tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$TAG_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "Syncing Helm chart version to $TAG_VERSION"
            sed -i "s/^version: .*/version: $TAG_VERSION/" k8s/helm/opensentinel/Chart.yaml
          fi

      - name: Package Helm chart
        run: |
          helm package k8s/helm/opensentinel

      - name: Push Helm chart to GHCR
        run: |
          PKG_NAME=$(ls opensentinel-*.tgz)
          OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}
          helm push $PKG_NAME oci://ghcr.io/${OWNER_LC}/helm

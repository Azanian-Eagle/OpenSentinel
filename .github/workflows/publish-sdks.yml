name: Publish SDKs

on:
  push:
    tags:
      - "v*"
      - "[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Sync NPM Package Versions with Git Tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$TAG_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "Syncing package versions to $TAG_VERSION"
            npm version "$TAG_VERSION" --no-git-tag-version --allow-same-version
            cd sdk/react/opensentinel-react
            npm version "$TAG_VERSION" --no-git-tag-version --allow-same-version
          fi

      - name: Install and Build React SDK
        run: |
          cd sdk/react/opensentinel-react
          npm ci
          npm run build

      - name: Publish React SDK
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "NODE_AUTH_TOKEN not provided, stripping empty auth from .npmrc for OIDC Trusted Publishing"
            sed -i '/_authToken=/d' ~/.npmrc 2>/dev/null || true
          fi
          cd sdk/react/opensentinel-react
          npm publish --access public --provenance || echo "::warning::React SDK npm publish failed."
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Install and Build Root NPM package
        run: |
          npm ci
          npm run build

      - name: Publish Root NPM package
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "NODE_AUTH_TOKEN not provided, stripping empty auth from .npmrc for OIDC Trusted Publishing"
            sed -i '/_authToken=/d' ~/.npmrc 2>/dev/null || true
          fi
          npm publish --access public --provenance || echo "::warning::Root package npm publish failed."
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-pypi:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tools
        run: pip install build

      - name: Sync Python SDK Version with Git Tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$TAG_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "Syncing Python SDK version to $TAG_VERSION"
            sed -i "s/^version = .*/version = \"$TAG_VERSION\"/" sdk/python/pyproject.toml
            sed -i "s/version=\".*\"/version=\"$TAG_VERSION\"/" sdk/python/setup.py
          fi

      - name: Build Python SDK
        run: |
          cd sdk/python
          python3 -m build

      - name: Publish Python SDK (Token Fallback)
        if: ${{ secrets.PYPI_TOKEN != '' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdk/python/dist/
          password: ${{ secrets.PYPI_TOKEN }}
          skip-existing: true

      - name: Publish Python SDK (Trusted Publishing / OIDC)
        if: ${{ secrets.PYPI_TOKEN == '' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdk/python/dist/
          skip-existing: true
          attestations: true

  publish-cargo:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: server -> target

      - name: Sync Cargo Crate Version with Git Tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$TAG_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "Syncing Cargo crate version to $TAG_VERSION"
            sed -i "s/^version = .*/version = \"$TAG_VERSION\"/" server/Cargo.toml
          fi

      - name: Publish to crates.io
        run: |
          cd server
          cargo publish || echo "::warning::Cargo publish failed."
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  publish-helm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync Helm Chart Version with Git Tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$TAG_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "Syncing Helm chart version to $TAG_VERSION"
            sed -i "s/^version: .*/version: $TAG_VERSION/" k8s/helm/opensentinel/Chart.yaml
          fi

      - name: Package Helm chart
        run: |
          helm package k8s/helm/opensentinel

      - name: Push Helm chart to GHCR
        run: |
          PKG_NAME=$(ls opensentinel-*.tgz)
          OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}
          helm push $PKG_NAME oci://ghcr.io/${OWNER_LC}/helm || echo "::warning::Helm push failed."

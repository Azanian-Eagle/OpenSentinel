name: Release Backend

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract backend metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/opensentinel
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Build release binary
        run: cargo build --release --manifest-path server/Cargo.toml

      - name: Package release bundle
        run: |
          mkdir -p release-bundle
          cp server/target/release/opensentinel-server release-bundle/
          cp server/model.onnx release-bundle/
          cp -R client release-bundle/client
          cp .env.example release-bundle/
          python -c "from pathlib import Path; path = Path('release-bundle/.env.example'); text = path.read_text(); text = text.replace('OPEN_SENTINEL_MODEL_PATH=/app/server/model.onnx', 'OPEN_SENTINEL_MODEL_PATH=model.onnx'); text = text.replace('OPEN_SENTINEL_CLIENT_DIR=/app/client', 'OPEN_SENTINEL_CLIENT_DIR=client'); path.write_text(text)"
          cp docker-compose.yml release-bundle/
          tar -czf opensentinel-backend-${{ github.ref_name }}.tar.gz -C release-bundle .

      - name: Upload release asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: opensentinel-backend-${{ github.ref_name }}.tar.gz
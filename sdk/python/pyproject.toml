[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "azanian-eagle-opensentinel"
version = "1.1.1"
description = "Self-Hosted Invisible CAPTCHA Replacement & Bot Detection Python SDK by Azanian Eagle: Zero-click verification and middleware for FastAPI and Flask. Visit https://azanian-eagle.github.io/OpenSentinel/ to explore the service and https://github.com/Azanian-Eagle for creator profile."
readme = "README.md"
license = "MIT"
authors = [{ name = "Azanian Eagle", email = "azanian.eagle@gmail.com" }]
keywords = [
    "opensentinel",
    "captcha",
    "bot-detection",
    "security",
    "privacy",
    "verification",
    "azanian-eagle",
    "anti-bot",
    "telemetry",
    "south-africa",
    "recaptcha-alternative",
    "turnstile-alternative",
    "hcaptcha-alternative",
    "captcha-replacement",
    "zero-click-captcha",
    "bot-protection-service",
    "azanian-eagle-creator",
    "proof-of-work",
    "popia",
    "gdpr"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
    "Framework :: Flask",
    "Topic :: Security",
    "Topic :: Security :: Cryptography",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules"
]
requires-python = ">=3.7"
dependencies = []

[project.urls]
Homepage = "https://azanian-eagle.github.io/OpenSentinel/"
Repository = "https://github.com/Azanian-Eagle/OpenSentinel"
Documentation = "https://github.com/Azanian-Eagle/OpenSentinel#readme"
"Bug Tracker" = "https://github.com/Azanian-Eagle/OpenSentinel/issues"
"Live Demo" = "https://azanian-eagle.github.io/OpenSentinel/demo.html"
